<style>

<script>
const BASE = 'assets/';

  if (k < 0) return base + OFF - .5;
  if (k >= M.frames.length - 1){ const endC = OFF + (M.frames.length - 1) * STEP + 63;   // from the last frame, moving on goes to the end credit, not past it
    return t < endC - 1 ? base + endC : base + LOOP; }
  return base + OFF + (k + 1) * STEP - 1.5; }   // next frame begins while the last words are still fading
const SCORES = {
  bedroom: [ ['base', 0, 7, 64, 9], ['wide', 6, 10, 58, 8], ['ink', 7, 8, 70, 12] ],
  fjord:   [ ['base', 0, 6, 62, 8], ['mid', 6, 9, 56, 7], ['right', 13, 9, 52, 7], ['ink', 11, 8, 72, 11] ],
  skywater:[ ['base', 0, 7, 60, 9], ['water', 7, 10, 64, 8], ['ink', 11, 8, 72, 11] ],
  barn:    [ ['base', 0, 6, 56, 8], ['right', 6, 9, 62, 8], ['ink', 11, 8, 72, 11] ],
  forest:  [ ['base', 0, 7, 62, 9], ['echo', 0, 7, 62, 9], ['ink', 11, 8, 72, 11] ],
  cloud:   [ ['base', 0, 8, 60, 9], ['mid', 6, 10, 58, 8], ['right', 13, 12, 56, 10], ['ink', 11, 8, 72, 11] ],
  lake:    [ ['base', 0, 7, 64, 9], ['him', 1, 9, 60, 8], ['ink', 11, 8, 72, 11] ],

// every frame is gone before the next has fully arrived, and the last one is gone before the loop returns to the title

let LOOP = 0;

function opacity(line, t){

  if (t < s || t > e + fo) return 0;

}
function breath(t){   // rest, drift across, rest, drift back — never quite regular
  const P = 14, ph = ((t + 3) % P) / P;

const WC = new Map();
function wcField(key, w, h){

  ctx.globalAlpha = alpha; ctx.drawImage(t, dx, dy, dw, dh);
}
let view = { z:1, x:960, y:540 }, reading = null, dismissed = new Set(), outFrom = null;
function draw(spec, a, wc){
  if (a <= .002 || !spec) return; const im = imgs[spec.src]; if (!im) return;
  const x = fit.x + ((spec.pos[0] - view.x) * view.z + M.w / 2) * fit.s, y = fit.y + ((spec.pos[1] - view.y) * view.z + M.h / 2) * fit.s,
        w = im.width * spec.scale * view.z * fit.s, h = im.height * spec.scale * view.z * fit.s;

  ctx.globalAlpha = a; ctx.drawImage(im, x, y, w, h);

// ---------------- reading: leaning in on the writing ----------------
function inkBox(f){ const L = f.layers.ink, im = L && imgs[L.src]; if (!im) return null;
  const w = im.width * L.scale, h = im.height * L.scale; return { x:L.pos[0], y:L.pos[1], w, h, cx:L.pos[0] + w / 2, cy:L.pos[1] + h / 2 }; }
function readTarget(f){ const b = inkBox(f); if (!b) return null;
  const z = Math.max(1.5, Math.min(3.2, M.w * .7 / b.w, M.h * .55 / b.h));
  const hw = M.w / 2 / z, hh = M.h / 2 / z;
  return { z, x:Math.min(M.w - hw, Math.max(hw, b.cx)), y:Math.min(M.h - hh, Math.max(hh, b.cy)) }; }
const HOLD = { bedroom:14, fjord:10, skywater:10, barn:9, forest:12, cloud:12, lake:10 };
function autoRead(t){   // once in each frame, after the words have developed, it leans in and waits for you
  for (let k = 0; k < M.frames.length; k++){ const f = M.frames[k]; let lt = t - (OFF + k * STEP); if (lt < -LOOP / 2) lt += LOOP; if (lt > LOOP / 2) lt -= LOOP;
    const ink = SCORES[f.name].find(l => l[0] === 'ink'); if (!ink) continue;
    const s = ink[1] + ink[2] + 1.5, hold = HOLD[f.name] || 10, u = lt - s;
    if (u < 0 || u > hold + 7) continue;
    const visit = k + ':' + Math.floor((clock - (OFF + k * STEP)) / LOOP);
    if (dismissed.has(visit)) return { f, w:0, visit, dismissedAt:true };
    const w = u < 3.5 ? ease(u / 3.5) : u < 3.5 + hold ? 1 : 1 - ease((u - 3.5 - hold) / 3.5);
    return { f, w, visit, prog:Math.min(1, u / (hold + 7)) }; }
  return null;
}
function applyView(target, w){
  if (!target || w <= 0){ view = { z:1, x:M.w / 2, y:M.h / 2 }; return; }
  view = { z:Math.exp(Math.log(target.z) * w), x:M.w / 2 + (target.x - M.w / 2) * w, y:M.h / 2 + (target.y - M.h / 2) * w }; }
function toDesign(sx, sy){ const d = W / innerWidth;
  return { x:view.x + ((sx * d - fit.x) / fit.s - M.w / 2) / view.z, y:view.y + ((sy * d - fit.y) / fit.s - M.h / 2) / view.z }; }
function inkUnder(sx, sy){ if (!M) return null; const t = clock % LOOP, p = toDesign(sx, sy);
  for (let k = 0; k < M.frames.length; k++){ const f = M.frames[k]; let lt = t - (OFF + k * STEP); if (lt < -LOOP / 2) lt += LOOP; if (lt > LOOP / 2) lt -= LOOP;
    const ink = SCORES[f.name].find(l => l[0] === 'ink'); if (!ink || opacity(ink, lt) < .25) continue;
    const b = inkBox(f); if (b && p.x > b.x - 50 && p.x < b.x + b.w + 50 && p.y > b.y - 45 && p.y < b.y + b.h + 45) return f; }
  return null; }
function drawnLoupe(){ const c = document.createElement('canvas'); c.width = c.height = 48; const g = c.getContext('2d'); let s = 7; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const wob = () => (r() - .5) * 1.4;
  const shape = () => { for (let a = 0; a <= 6.5; a += .35){ const rr = 11 + wob() * .6, x = 18 + Math.cos(a) * rr, y = 18 + Math.sin(a) * rr; a ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.moveTo(26 + wob(), 26 + wob()); g.lineTo(33 + wob(), 34 + wob()); g.lineTo(41 + wob(), 42 + wob()); };
  [['rgba(0,0,0,.55)', 4.5], ['rgba(226,232,212,.9)', 1.8]].forEach(([col, lw]) => { g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; for (let p = 0; p < 2; p++){ g.beginPath(); shape(); g.stroke(); } });
  return `url(${c.toDataURL()}) 18 18, zoom-in`; }
const LOUPE = drawnLoupe();
function drawnRing(){   // one plain cursor everywhere: a small hand-drawn ring; the word beside it says what a touch does
  const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'); let s = 11; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const ring = () => { g.beginPath(); for (let a = 0; a <= 6.6; a += .3){ const rr = 7 + (r() - .5) * .9, x = 16 + Math.cos(a) * rr, y = 16 + Math.sin(a) * rr; a ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); };
  g.lineCap = 'round'; g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 3.4; ring(); g.strokeStyle = 'rgba(226,232,212,.92)'; g.lineWidth = 1.5; ring();
  return `url(${c.toDataURL()}) 16 16, crosshair`; }
const RING = drawnRing();
// he doesn't fade in, he catches: a few stuttering exposures, a slip sideways, then he lands at about a third and stays, dropping out now and then
// layers that never settle: a slow, uneven dissolve between lo and hi, living nearer hi, with a rare glitch
// lake: he catches in with a few stutters, then drifts, mostly visible.  forest: the larger copy of itself dissolves ~60-80%.
const GLITCH = { lake:{ layer:'him', lo:.36, hi:.66, arrive:true }, forest:{ layer:'echo', lo:.72, hi:1, arrive:false } };
function hash(n){ n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function driftL(t, seed){ const v = .5 + .22 * Math.sin(t * .41 + seed) + .17 * Math.sin(t * .23 + seed * 2.1) + .11 * Math.sin(t * .97 + seed * .7);

  if (g.arrive && t < s + fi){ const u = (t - s) / fi;           // he comes and goes a few times as the picture loads, then stays
    const swell = u < .28 ? Math.sin(u / .28 * Math.PI) * .55 : u < .56 ? Math.sin((u - .28) / .28 * Math.PI) * .8 : ease((u - .56) / .44);

function drawFrame(f, t){

    const a = opacity(line, t); const G = GLITCH[f.name];
    if (G && G.layer === line[0]){ const [ga, dx] = glitch(G, line, t, a), L = f.layers[line[0]]; draw(L && { ...L, pos:[L.pos[0] + dx, L.pos[1]] }, ga);

function drawHint(f, t){   // once, in the first scene: a small (closer) beside the words, until someone touches them
  const b = inkBox(f); if (!b) return;
  if (!HINT) HINT = handCanvas('(come closer)', 28, Math.round(b.y + 26), -(b.x - 18));
  const L = { src:'__hint', pos:[0, 0], scale:1 };
  const x = fit.x + ((0 - view.x) * view.z + M.w / 2) * fit.s, y = fit.y + ((0 - view.y) * view.z + M.h / 2) * fit.s;

// ---------------- flashes: fragments of other moments ----------------
// Some flicker and flutter away. Some come back and become the next frame.
const FRAGS = ["always the old road.", "we never asked why.", "the next valley?", "who remembers it differently?",

let FL = null; const fimgs = {}; let flashes = [], nextCluster = 8, becomeDone = new Set(), flashOn = true;
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function coverRectD(im){ const s = Math.max(M.w / im.width, M.h / im.height); return [(M.w - im.width * s) / 2, (M.h - im.height * s) / 2, im.width * s, im.height * s]; }
let TOOTH = null;
function tooth(){   // paper tooth + blotches: the ink takes unevenly
  if (TOOTH) return TOOTH;
  const w = 480, h = 270, c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  const id = x.createImageData(w, h);
